<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber-Forge · 铁匠铺</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-append.css" />

</head>
<body>

  <!--
    严格对齐终端 Ratatui 布局（forge_loop/render.rs）：
    横向 22% | 50% | 28%
    左：Line4 矩阵锦囊
    中：Line1 铁匠信息 → Line2 锻造台 → Line3 铁匠铺 → Line6 身体素质 → Line8 天道纪事
    右：Line5 藏宝阁拍卖
    底：Line7 熔炼/上架档 + 市井杂闻
  -->
  <div id="root">
    <div id="main">

      <!-- LEFT 22% · Line4 -->
      <section class="panel col-left" id="line4">
<!-- 资财仪盘小窗口 -->
<!-- 资财仪盘小窗口（点击金币或协议标签弹出下拉菜单） -->
<div class="panel currency-panel" id="currencyPanel" style="position: relative; overflow: visible !important;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
    <span style="font-size: 10px; color: #8a96a6;">【资财仪盘】</span>

    <!-- 下拉菜单包裹区 -->
    <div style="position: relative;">
      <button type="button" id="currProtocolBtn" style="background: rgba(0,255,200,0.1); border: 1px solid #00ffc8; color: #00ffc8; border-radius: 4px; font-size: 10px; padding: 1px 6px; cursor: pointer;">
        [天道纳玉] ▾
      </button>

      <!-- 🌟 点击弹出的下拉菜单 -->
      <div id="currProtocolMenu" style="display: none; position: absolute; right: 0; top: 100%; margin-top: 4px; background: #0e1218; border: 1px solid #3c5a64; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.9); z-index: 999; min-width: 110px; padding: 4px 0;">
        <div class="curr-menu-item" data-mode="1" style="padding: 6px 10px; font-size: 10px; color: #00ffc8; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);">⚡ [天道纳玉]</div>
        <div class="curr-menu-item" data-mode="2" style="padding: 6px 10px; font-size: 10px; color: #ffd700; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);">🛡️ [灵虚兜底]</div>
        <div class="curr-menu-item" data-mode="0" style="padding: 6px 10px; font-size: 10px; color: #8c96a6; cursor: pointer;">🚫 [协议关闭]</div>
      </div>
    </div>
  </div>

  <div class="currency-body" id="currencyBodyClickable" style="cursor: pointer;" title="点击切换资财协议">
    <span class="curr-item copper">铜钱 <strong id="copperText">0</strong></span>
    <span class="curr-divider">│</span>
    <span class="curr-item gold">金币 <strong id="goldText">0</strong></span>
    <span class="curr-divider">│</span>
    <span class="curr-item jade">仙玉 <strong id="jadeText">0</strong></span>
  </div>
</div>

<header class="ptitle" id="line4Title" style="display: flex; justify-content: space-between; align-items: center;">
  <span>【矩阵锦囊】0/20 [D]扩</span>
  <button type="button" class="panel-toggle-btn" data-target="stashBody" style="background:none; border:1px solid var(--edge); color:var(--text); cursor:pointer; padding:0 4px; font-size:10px; border-radius:3px;">[_]</button>
</header>
<div id="stashBody" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
  <div class="matrix" id="stash"></div>
</div>
        <div class="currency-row">
        </div>
      </section>

      <!-- CENTER 50% · middle stack -->
      <section class="col-mid">
        <!-- Line1 -->
        <div class="panel line line1" id="line1">
          <header class="ptitle">【铁匠信息】</header>
          <div class="line1-body">
            <span id="level">LV.1</span>
            <div class="exp-wrap"><div class="exp-fill" id="expFill"></div></div>
            <span id="expText">0/0</span>
          </div>
        </div>

<!-- Line2 锻造台 · 读条锚点 -->
<div class="panel line line2" id="line2">
  <div class="panel-inner">

    <!-- 🌟 修改这里：把 QTE 融合进标题行 -->
    <header class="ptitle" id="line2Title">
      【锻造台】<span id="hammerInfoText"></span>
      <span id="titleQte" style="color: var(--crit, #ff4d7a); float: right;">完美 0.0</span>
    </header>

    <div id="anvil">
      <div class="anvil-glow" id="anvilGlow"></div>
      <canvas id="sparks"></canvas>

      <div class="bar-wrap">
        <div id="crit"></div>
        <div id="fill"><span class="fill-head"></span></div>
      </div>
    </div>

    <div class="forge-stations" id="forgeStations" hidden></div>
  </div>
</div>

        <!-- Line3 铁匠铺学徒 -->
        <div class="panel line line3" id="line3">
          <header class="ptitle" id="line3Title">【铁匠铺】学徒 0/10 [A]招 [R]扩</header>
          <div class="apprentice-grid" id="apprenticeRow">
            <div class="job"><span class="job-name">磨剑台</span><span class="job-n" id="jobSharpen">0</span></div>
            <div class="job"><span class="job-name">附魔台</span><span class="job-n" id="jobEnchant">0</span></div>
            <div class="job"><span class="job-name">熔铸台</span><span class="job-n" id="jobRepair">0</span></div>
            <div class="job"><span class="job-name">锻造台</span><span class="job-n" id="jobForge">0</span></div>
            <div class="job"><span class="job-name">拍卖行</span><span class="job-n" id="jobAuction">0</span></div>
          </div>
        </div>

        <!-- Line6 身体素质 -->
        <div class="panel line line6" id="line6">
          <header class="ptitle" id="line6Title">【身体素质】</header>
          <div class="body-grid" id="bodyGrid"></div>
        </div>

        <!-- Line8 日志 -->
        <div class="panel line line8" id="line8">
<header class="ptitle" style="display: flex; justify-content: space-between; align-items: center;">
  <span>【天道纪事·日志】</span>
  <button type="button" class="panel-toggle-btn" data-target="logBody" style="background:none; border:1px solid var(--edge); color:var(--text); cursor:pointer; padding:0 4px; font-size:10px; border-radius:3px;">[_]</button>
</header>
<div id="logBody" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
  <div class="log-list" id="logList"></div>
</div>
        </div>
      </section>

      <!-- RIGHT 28% · Line5 -->
      <section class="panel col-right" id="line5">
<header class="ptitle" id="line5Title" style="display: flex; justify-content: space-between; align-items: center;">
  <span>【藏宝阁拍卖】0/20 [E]扩</span>
  <button type="button" class="panel-toggle-btn" data-target="auctionBody" style="background:none; border:1px solid var(--edge); color:var(--text); cursor:pointer; padding:0 4px; font-size:10px; border-radius:3px;">[_]</button>
</header>
<div id="auctionBody" style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;">
  <div class="pavilion-hint">倒计时零落槌 · 加价重置 · 阶梯阻尼</div>
  <div class="lots" id="lots"></div>
</div>
        <footer class="ptitle-bottom" id="line5Bottom">云集道友 —</footer>
      </section>
    </div>

    <!-- BOTTOM · Line7 -->
    <footer class="line7" id="line7">
      <div class="line7-left">
          <div class="line7-left">
            <span id="meltTier">[T]熔炼 …</span>
            <span id="listTier">[G]上架 …</span>
            <span id="breakHint" class="hidden">…</span>
            <span class="auto-strike-wrap">
            </span>
          </div>
          <span id="breakHint" class="hidden">⚡[B]突破引劫</span>
      </div>
<span class="cf-toggle-wrap">
  <button type="button" class="cf-toggle" id="autoStrikeBtn"></button>
  <span class="cf-toggle-label">K-挂机锤</span>
</span>
      <div class="line7-right" id="news">杂闻：—</div>
      <!-- 🌟 修改这里：在底栏右侧加入 FPS 显示和杂闻 -->
      <div class="line7-right" style="display: flex; gap: 12px; align-items: center;">
        <span id="fpsDisplay" style="color: #00ffc8; font-family: monospace; font-weight: bold;">FPS: --</span>
    </footer>
  </div>
  <div id="toast" class="toast"></div>
  <script src="pixi.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/progressbar.js"></script>
</body>
</html>
