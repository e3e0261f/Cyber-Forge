[package]
name = "cyber-forge"
version = "2.3.0"
edition = "2021"
authors = ["CyberCraftsman <forge@heavenly.dev>"]
description = "键盘铸剑大师 Cyber-Forge v2.3"

[dependencies]
ratatui = { version = "0.26", features = ["all-widgets"] }
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", features = ["std"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
