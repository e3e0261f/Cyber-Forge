[package]
name = "cyber-forge"
version = "1.9.6"
edition = "2021"
authors = ["CyberCraftsman <forge@heavenly.dev>"]
description = "锻造大师：赛博工匠与天道炉火 - 硬核终端 Ratatui UI 挂机修真游戏"

[dependencies]
ratatui = { version = "0.26", features = ["all-widgets"] }
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
