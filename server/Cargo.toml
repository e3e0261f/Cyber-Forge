[package]
name = "cyber-forge-server"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/e3e0261f/rustCF2513"

[dependencies]
cyber-forge-shared = { path = "../shared" }
actix-web = "4.9"
actix-ws = "0.3"
actix-files = "0.6"
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

# 🌟 TiKV 分布式存储客户端
tikv-client = "0.3"

# 🌟 Kafka 事件流 (第二步)
rdkafka = { version = "0.36", features = ["cmake-build"] }

# 🌟 压缩归档 (第三步)
zstd = "0.13"
