<!-- 🌟 全面采用无 CORS 拦截的 esm.sh 标准模块加载 -->
    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.128.0';
        import RAPIER from 'https://esm.sh/@dimforge/rapier3d-compat@0.11.2';

        /* ==========================================================
           1. 画板系统
           ========================================================== */
        const cvs = document.getElementById('paint-canvas');
        const ctx = cvs.getContext('2d');
        let isDrawing = false;
        let brushColor = '#111';
        let currentTarget = 'face';

        const partCanvases = {
            face: document.createElement('canvas'),
            chest: document.createElement('canvas'),
            arm: document.createElement('canvas'),
            leg: document.createElement('canvas')
        };
        const histories = { face: [], chest: [], arm: [], leg: [] };

        const partBaseColors = {
            face: '#00ffcc',
            chest: '#00ffcc',
            arm: '#ffe0b2',
            leg: '#34495e'
        };

        Object.values(partCanvases).forEach(c => { c.width = 256; c.height = 256; });

        function initCanvasWithDefault() {
            const fCtx = partCanvases.face.getContext('2d');
            fCtx.clearRect(0,0,256,256);
            fCtx.lineWidth = 14; fCtx.strokeStyle = '#111'; fCtx.lineCap = 'round';
            fCtx.beginPath(); fCtx.arc(88, 105, 12, 0, Math.PI*2); fCtx.arc(168, 105, 12, 0, Math.PI*2); fCtx.fill();
            fCtx.beginPath(); fCtx.arc(128, 135, 36, 0.15*Math.PI, 0.85*Math.PI); fCtx.stroke();

            const cCtx = partCanvases.chest.getContext('2d');
            cCtx.clearRect(0,0,256,256);
            cCtx.lineWidth = 14; cCtx.strokeStyle = '#111'; cCtx.lineCap = 'round';
            cCtx.beginPath(); cCtx.moveTo(128, 40); cCtx.lineTo(128, 200); cCtx.stroke();
            cCtx.fillStyle = '#ffffff';
            cCtx.beginPath(); cCtx.arc(128, 128, 30, 0, Math.PI*2); cCtx.fill(); cCtx.stroke();

            partCanvases.arm.getContext('2d').clearRect(0,0,256,256);
            partCanvases.leg.getContext('2d').clearRect(0,0,256,256);

            loadToPad();
        }

        function saveFromPad() {
            const dest = partCanvases[currentTarget].getContext('2d');
            dest.clearRect(0,0,256,256);
            dest.drawImage(cvs, 0, 0, 256, 256);
        }

        function loadToPad() {
            ctx.clearRect(0,0,140,140);
            ctx.drawImage(partCanvases[currentTarget], 0, 0, 140, 140);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.strokeStyle = brushColor;

            document.getElementById('picker-base-color').value = partBaseColors[currentTarget];
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                saveFromPad();
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTarget = btn.getAttribute('data-part');
                loadToPad();
            };
        });

        document.getElementById('picker-base-color').oninput = (e) => {
            partBaseColors[currentTarget] = e.target.value;
            update3DMaterials();
        };

        cvs.addEventListener('mousedown', (e) => {
            const h = histories[currentTarget];
            if (h.length > 15) h.shift();
            h.push(ctx.getImageData(0,0,140,140));

            isDrawing = true;
            ctx.strokeStyle = brushColor;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });
        cvs.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        });
        window.addEventListener('mouseup', () => { isDrawing = false; saveFromPad(); });

        document.getElementById('btn-undo').onclick = () => {
            const h = histories[currentTarget];
            if (h.length > 0) {
                ctx.putImageData(h.pop(), 0, 0);
                saveFromPad();
            }
        };

        document.getElementById('btn-clear').onclick = () => {
            const h = histories[currentTarget];
            if (h.length > 15) h.shift();
            h.push(ctx.getImageData(0,0,140,140));

            ctx.clearRect(0, 0, 140, 140);
            saveFromPad();
        };

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                brushColor = dot.getAttribute('data-color');
            };
        });

        initCanvasWithDefault();

        /* ==========================================================
           2. Three.js 固定 2.5D 场景
           ========================================================== */
        const stage = document.getElementById('webgl-stage');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06080d);
        scene.fog = new THREE.Fog(0x06080d, 12, 30);

        const camera = new THREE.PerspectiveCamera(40, stage.clientWidth / stage.clientHeight, 0.1, 100);
        camera.position.set(0, 3.4, 5.8);
        camera.lookAt(0, 1.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(stage.clientWidth, stage.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        stage.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = stage.clientWidth / stage.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(stage.clientWidth, stage.clientHeight);
        });

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111622, 0.9);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
        dirLight.position.set(4, 7, 4);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xff0077, 0.7);
        backLight.position.set(-4, 4, -4);
        scene.add(backLight);

        const gridHelper = new THREE.GridHelper(24, 24, 0x00ffcc, 0x141a29);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x080b12, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        /* ==========================================================
           3. 3D 角色模型结构
           ========================================================== */
        const charRoot = new THREE.Group();
        scene.add(charRoot);

        const skeletonRig = {
            pelvis: new THREE.Group(),
            spine:  new THREE.Group(),
            chest:  new THREE.Group(),
            neck:   new THREE.Group(),
            head:   new THREE.Group(),
            shoulderL: new THREE.Group(), elbowL: new THREE.Group(),
            shoulderR: new THREE.Group(), elbowR: new THREE.Group(),
            hipL: new THREE.Group(), kneeL: new THREE.Group(),
            hipR: new THREE.Group(), kneeR: new THREE.Group(),
        };

        let headMeshNode, bodyMeshNode;
        let limbMeshes = [];

        function createSpherifiedGeometry(w, h, d, roundFactor) {
            const segments = 16;
            const geo = new THREE.BoxGeometry(w, h, d, segments, segments, segments);
            const pos = geo.attributes.position;
            const v = new THREE.Vector3();
            const radius = Math.min(w, Math.min(h, d)) / 2;

            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i);
                const len = v.length();
                if (len > 0.0001) {
                    const sphereX = (v.x / len) * radius;
                    const sphereY = (v.y / len) * radius;
                    const sphereZ = (v.z / len) * radius;

                    v.x = THREE.MathUtils.lerp(v.x, sphereX, roundFactor);
                    v.y = THREE.MathUtils.lerp(v.y, sphereY, roundFactor);
                    v.z = THREE.MathUtils.lerp(v.z, sphereZ, roundFactor);
                }
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geo.computeVertexNormals();
            return geo;
        }

        function createCombinedCanvasTexture(baseHex, drawCanvas) {
            const temp = document.createElement('canvas');
            temp.width = 256; temp.height = 256;
            const tCtx = temp.getContext('2d');
            tCtx.fillStyle = baseHex;
            tCtx.fillRect(0, 0, 256, 256);
            tCtx.drawImage(drawCanvas, 0, 0, 256, 256);
            const tex = new THREE.CanvasTexture(temp);
            tex.needsUpdate = true;
            return tex;
        }

        function update3DMaterials() {
            if (headMeshNode) {
                const combinedFace = createCombinedCanvasTexture(partBaseColors.face, partCanvases.face);
                headMeshNode.material[4].map = combinedFace;
                headMeshNode.material[4].needsUpdate = true;
                for (let i = 0; i < 6; i++) {
                    if (i !== 4) headMeshNode.material[i].color.set(partBaseColors.face);
                }
            }
            if (bodyMeshNode) {
                const combinedChest = createCombinedCanvasTexture(partBaseColors.chest, partCanvases.chest);
                bodyMeshNode.material[4].map = combinedChest;
                bodyMeshNode.material[4].needsUpdate = true;
                for (let i = 0; i < 6; i++) {
                    if (i !== 4) bodyMeshNode.material[i].color.set(partBaseColors.chest);
                }
            }
            limbMeshes.forEach(item => {
                if (item.type === 'arm') item.mesh.material.color.set(partBaseColors.arm);
                if (item.type === 'leg') item.mesh.material.color.set(partBaseColors.leg);
            });
        }

        function assembleHumanoidSkeleton(roundFactor, headScale, bodyScale) {
            charRoot.clear();
            limbMeshes = [];

            skeletonRig.pelvis = new THREE.Group();
            skeletonRig.pelvis.position.set(0, 0.75, 0);
            charRoot.add(skeletonRig.pelvis);

            skeletonRig.spine = new THREE.Group();
            skeletonRig.spine.position.set(0, 0.2, 0);
            skeletonRig.pelvis.add(skeletonRig.spine);

            skeletonRig.chest = new THREE.Group();
            skeletonRig.chest.position.set(0, 0.25, 0);
            skeletonRig.spine.add(skeletonRig.chest);

            skeletonRig.neck = new THREE.Group();
            skeletonRig.neck.position.set(0, 0.35, 0);
            skeletonRig.chest.add(skeletonRig.neck);

            skeletonRig.head = new THREE.Group();
            skeletonRig.head.position.set(0, 0.35 * headScale, 0);
            skeletonRig.neck.add(skeletonRig.head);

            const headMatBase = new THREE.MeshStandardMaterial({ color: partBaseColors.face, roughness: 0.35 });
            const faceCombinedTex = createCombinedCanvasTexture(partBaseColors.face, partCanvases.face);
            const headMatFace = new THREE.MeshStandardMaterial({ map: faceCombinedTex, roughness: 0.35 });
            const headMaterials = [headMatBase, headMatBase, headMatBase, headMatBase, headMatFace, headMatBase];

            const bodyMatBase = new THREE.MeshStandardMaterial({ color: partBaseColors.chest, roughness: 0.35 });
            const chestCombinedTex = createCombinedCanvasTexture(partBaseColors.chest, partCanvases.chest);
            const bodyMatChest = new THREE.MeshStandardMaterial({ map: chestCombinedTex, roughness: 0.35 });
            const bodyMaterials = [bodyMatBase, bodyMatBase, bodyMatBase, bodyMatBase, bodyMatChest, bodyMatBase];

            const armMat = new THREE.MeshStandardMaterial({ color: partBaseColors.arm, roughness: 0.4 });
            const legMat = new THREE.MeshStandardMaterial({ color: partBaseColors.leg, roughness: 0.4 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xe0ac69, roughness: 0.4 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x11141c, roughness: 0.4 });

            // 头部
            const hGeo = createSpherifiedGeometry(0.72 * headScale, 0.72 * headScale, 0.68 * headScale, roundFactor);
            headMeshNode = new THREE.Mesh(hGeo, headMaterials);
            headMeshNode.castShadow = true;
            skeletonRig.head.add(headMeshNode);

            // 身体
            const bGeo = createSpherifiedGeometry(0.72 * bodyScale, 0.85 * bodyScale, 0.46 * bodyScale, roundFactor);
            bodyMeshNode = new THREE.Mesh(bGeo, bodyMaterials);
            bodyMeshNode.position.y = -0.1;
            bodyMeshNode.castShadow = true;
            skeletonRig.chest.add(bodyMeshNode);

            // 双臂
            function attachArm(isLeft) {
                const shoulder = new THREE.Group();
                shoulder.position.set(isLeft ? -0.48 * bodyScale : 0.48 * bodyScale, 0.22, 0);

                const upGeo = createSpherifiedGeometry(0.20, 0.38, 0.22, roundFactor);
                const upMesh = new THREE.Mesh(upGeo, armMat.clone());
                upMesh.position.y = -0.19;
                upMesh.castShadow = true;
                shoulder.add(upMesh);
                limbMeshes.push({ mesh: upMesh, type: 'arm' });

                const elbow = new THREE.Group();
                elbow.position.set(0, -0.38, 0);

                const lowGeo = createSpherifiedGeometry(0.18, 0.32, 0.20, roundFactor);
                const lowMesh = new THREE.Mesh(lowGeo, armMat.clone());
                lowMesh.position.y = -0.16;
                lowMesh.castShadow = true;
                elbow.add(lowMesh);
                limbMeshes.push({ mesh: lowMesh, type: 'arm' });

                const handGeo = createSpherifiedGeometry(0.18, 0.14, 0.20, roundFactor);
                const handMesh = new THREE.Mesh(handGeo, skinMat);
                handMesh.position.y = -0.39;
                handMesh.castShadow = true;
                elbow.add(handMesh);

                shoulder.add(elbow);
                skeletonRig.chest.add(shoulder);
                return { shoulder, elbow };
            }

            const armL = attachArm(true);
            skeletonRig.shoulderL = armL.shoulder; skeletonRig.elbowL = armL.elbow;

            const armR = attachArm(false);
            skeletonRig.shoulderR = armR.shoulder; skeletonRig.elbowR = armR.elbow;

            // 双腿
            function attachLeg(isLeft) {
                const hip = new THREE.Group();
                hip.position.set(isLeft ? -0.22 : 0.22, -0.05, 0);

                const thighGeo = createSpherifiedGeometry(0.22, 0.36, 0.24, roundFactor);
                const thighMesh = new THREE.Mesh(thighGeo, legMat.clone());
                thighMesh.position.y = -0.18;
                thighMesh.castShadow = true;
                hip.add(thighMesh);
                limbMeshes.push({ mesh: thighMesh, type: 'leg' });

                const knee = new THREE.Group();
                knee.position.set(0, -0.36, 0);

                const shinGeo = createSpherifiedGeometry(0.20, 0.32, 0.22, roundFactor);
                const shinMesh = new THREE.Mesh(shinGeo, legMat.clone());
                shinMesh.position.y = -0.16;
                shinMesh.castShadow = true;
                knee.add(shinMesh);
                limbMeshes.push({ mesh: shinMesh, type: 'leg' });

                const shoeGeo = createSpherifiedGeometry(0.22, 0.12, 0.30, roundFactor);
                const shoeMesh = new THREE.Mesh(shoeGeo, darkMat);
                shoeMesh.position.set(0, -0.38, 0.04);
                shoeMesh.castShadow = true;
                knee.add(shoeMesh);

                hip.add(knee);
                skeletonRig.pelvis.add(hip);
                return { hip, knee };
            }

            const legL = attachLeg(true);
            skeletonRig.hipL = legL.hip; skeletonRig.kneeL = legL.knee;

            const legR = attachLeg(false);
            skeletonRig.hipR = legR.hip; skeletonRig.kneeR = legR.knee;

            const s = parseFloat(sliderScale.value);
            charRoot.scale.set(s, s, s);
        }

        document.getElementById('btn-sync-tex').onclick = () => {
            saveFromPad();
            update3DMaterials();
        };

        /* ==========================================================
           4. 导出 JSON 配置
           ========================================================== */
        document.getElementById('btn-export-json').onclick = () => {
            saveFromPad();
            const config = {
                engine: "Rapier3D_WASM_Gravity_Rig",
                version: "Rapier_Chibi_v2.0",
                character_id: "cultivator_" + Date.now(),
                timestamp: Date.now(),
                proportions: {
                    overall_scale: parseFloat(sliderScale.value),
                    head_scale: parseFloat(sliderHeadSize.value),
                    body_scale: parseFloat(sliderBodySize.value),
                    roundness: parseFloat(sliderRoundness.value),
                },
                physics_gravity: {
                    world_gravity_y: parseFloat(sliderWorldGravity.value),
                    limb_gravity_sensitivity: parseFloat(sliderLimbGravity.value),
                    ragdoll_floppiness: parseFloat(sliderRagdoll.value),
                    cadence_freq: parseFloat(sliderFreq.value),
                    swing_amplitude: parseFloat(sliderSwing.value),
                    knee_flex: parseFloat(sliderKnee.value),
                    wobble_bounce: parseFloat(sliderWobble.value),
                },
                colors: { ...partBaseColors },
                textures: {
                    face_png: partCanvases.face.toDataURL(),
                    chest_png: partCanvases.chest.toDataURL()
                }
            };

            document.getElementById('json-textarea').value = JSON.stringify(config, null, 2);
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        document.getElementById('btn-close-modal').onclick = () => {
            document.getElementById('modal-overlay').style.display = 'none';
        };
        document.getElementById('btn-copy-json').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('json-textarea').value);
            alert("✅ 角色物理参数 JSON 已成功复制！");
        };

        /* ==========================================================
           5. 🌟 异步初始化 Rapier 3D 官方 WASM 引擎
           ========================================================== */
        const sliderWorldGravity = document.getElementById('slider-world-gravity');
        const sliderLimbGravity  = document.getElementById('slider-limb-gravity');
        const sliderScale        = document.getElementById('slider-scale');
        const sliderHeadSize     = document.getElementById('slider-head-size');
        const sliderBodySize     = document.getElementById('slider-body-size');
        const sliderRoundness    = document.getElementById('slider-roundness');
        const sliderRagdoll      = document.getElementById('slider-ragdoll');
        const sliderFreq         = document.getElementById('slider-freq');
        const sliderSwing        = document.getElementById('slider-swing');
        const sliderKnee         = document.getElementById('slider-knee');
        const sliderWobble       = document.getElementById('slider-wobble');

        let rapierWorld = null;

        // 异步等待 Rapier WASM 初始化完成
        await RAPIER.init({});
        const initialGravity = new RAPIER.Vector3(0.0, -10.0, 0.0);
        rapierWorld = new RAPIER.World(initialGravity);
        document.getElementById('label-physics').textContent = "Rapier 3D (WASM 物理双向驱动就绪)";

        sliderWorldGravity.oninput = () => {
            const g = parseFloat(sliderWorldGravity.value);
            document.getElementById('label-gravity').textContent = `${g.toFixed(1)} m/s²` + (g === 0 ? " (零重力太空漂浮)" : (g > 20 ? " (超重力沉重下坠)" : ""));
            if (rapierWorld) {
                rapierWorld.gravity = new RAPIER.Vector3(0.0, -g, 0.0);
            }
        };

        function refreshSkeleton() {
            const r = parseFloat(sliderRoundness.value);
            const labelNode = document.getElementById('label-form');
            if (labelNode) {
                labelNode.textContent = r > 0.8 ? "正圆形潮玩萌球体 (默认)" : (r > 0.2 ? "圆角潮玩手办" : "纯方块体素机甲");
            }
            assembleHumanoidSkeleton(
                r,
                parseFloat(sliderHeadSize.value),
                parseFloat(sliderBodySize.value)
            );
        }

        sliderScale.oninput     = () => { const s = parseFloat(sliderScale.value); charRoot.scale.set(s, s, s); };
        sliderHeadSize.oninput  = refreshSkeleton;
        sliderBodySize.oninput  = refreshSkeleton;
        sliderRoundness.oninput = refreshSkeleton;

        refreshSkeleton();

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let charPos = new THREE.Vector3(0, 0, 0);
        let targetRotation = 0;
        let animTime = 0;

        let noodleRoll = 0, noodleRollVel = 0;
        let headInertiaYaw = 0;

        let armL_angle = 0, armL_vel = 0;
        let armR_angle = 0, armR_vel = 0;
        let elbowL_angle = 0, elbowL_vel = 0;
        let elbowR_angle = 0, elbowR_vel = 0;

        let legL_angle = 0, legL_vel = 0;
        let legR_angle = 0, legR_vel = 0;

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const dt = Math.min(0.033, delta);

            // 1. 物理引擎步进
            if (rapierWorld) {
                rapierWorld.step();
            }

            let moveX = 0, moveZ = 0;
            if (keys['w'] || keys['arrowup']) moveZ -= 1;
            if (keys['s'] || keys['arrowdown']) moveZ += 1;
            if (keys['a'] || keys['arrowleft']) moveX -= 1;
            if (keys['d'] || keys['arrowright']) moveX += 1;

            const isMoving = (moveX !== 0 || moveZ !== 0);

            const curSpeed   = 4.0;
            const worldG     = parseFloat(sliderWorldGravity.value);
            const limbGFactor= parseFloat(sliderLimbGravity.value);
            const ragdoll    = parseFloat(sliderRagdoll.value);
            const curFreq    = parseFloat(sliderFreq.value);
            const curSwing   = parseFloat(sliderSwing.value);
            const curKnee    = parseFloat(sliderKnee.value);
            const curWobble  = parseFloat(sliderWobble.value);

            if (isMoving) {
                targetRotation = Math.atan2(moveX, moveZ);

                const moveDir = new THREE.Vector3(moveX, 0, moveZ).normalize();
                charPos.addScaledVector(moveDir, curSpeed * dt);

                charPos.x = Math.max(-9, Math.min(9, charPos.x));
                charPos.z = Math.max(-9, Math.min(9, charPos.z));
                charRoot.position.copy(charPos);

                animTime += dt * curFreq;
            } else {
                animTime += dt * 2.5;
            }

            // 平滑转向
            let currentRot = charRoot.rotation.y;
            let diff = targetRotation - currentRot;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            charRoot.rotation.y += diff * 0.18;

            headInertiaYaw += (diff * 0.35 - headInertiaYaw) * 0.2;

            // 物理重力矩计算
            const gTorqueScale = (worldG * 0.1) * limbGFactor;

            if (isMoving) {
                const step = Math.sin(animTime);
                const bounce = Math.abs(Math.sin(animTime)) * 0.10 * curWobble;

                skeletonRig.pelvis.position.y = 0.75 + bounce;
                skeletonRig.pelvis.rotation.z = step * 0.14 * curWobble;
                skeletonRig.pelvis.rotation.x = Math.cos(animTime * 2) * 0.06;

                const targetRoll = -step * 0.22 * curWobble;
                noodleRollVel = (noodleRollVel + (targetRoll - noodleRoll) * 22 * dt) * 0.86;
                noodleRoll += noodleRollVel * dt;

                skeletonRig.spine.rotation.z = noodleRoll;
                skeletonRig.spine.rotation.y = step * 0.12 * curWobble;

                skeletonRig.head.rotation.z = -noodleRoll * 0.9;
                skeletonRig.head.rotation.y = headInertiaYaw + Math.sin(animTime) * 0.1;
                skeletonRig.head.rotation.x = 0.08;

                const activeSwing = step * curSwing;

                // 左臂
                const armL_target = activeSwing * (1.0 - ragdoll * 0.3);
                const gravityPullL = -Math.sin(armL_angle) * gTorqueScale * 8.0;
                armL_vel = (armL_vel + ((armL_target - armL_angle) * 25 + gravityPullL) * dt) * (0.92 - ragdoll * 0.05);
                armL_angle += armL_vel * dt;

                skeletonRig.shoulderL.rotation.x = armL_angle;
                skeletonRig.shoulderL.rotation.z = (Math.sin(animTime) * ragdoll * 0.4) + (gTorqueScale * 0.02);

                const elbowL_target = -0.2 - Math.max(0, -activeSwing * 0.5) - (ragdoll * Math.sin(animTime * 2) * 0.8);
                const gravityPullElbowL = -Math.sin(elbowL_angle) * gTorqueScale * 10.0;
                elbowL_vel = (elbowL_vel + ((elbowL_target - elbowL_angle) * 20 + gravityPullElbowL) * dt) * 0.88;
                elbowL_angle += elbowL_vel * dt;
                skeletonRig.elbowL.rotation.x = elbowL_angle;

                // 右臂
                const armR_target = -activeSwing * (1.0 - ragdoll * 0.3);
                const gravityPullR = -Math.sin(armR_angle) * gTorqueScale * 8.0;
                armR_vel = (armR_vel + ((armR_target - armR_angle) * 25 + gravityPullR) * dt) * (0.92 - ragdoll * 0.05);
                armR_angle += armR_vel * dt;

                skeletonRig.shoulderR.rotation.x = armR_angle;
                skeletonRig.shoulderR.rotation.z = (-Math.sin(animTime) * ragdoll * 0.4) - (gTorqueScale * 0.02);

                const elbowR_target = -0.2 - Math.max(0, activeSwing * 0.5) + (ragdoll * Math.sin(animTime * 2) * 0.8);
                const gravityPullElbowR = -Math.sin(elbowR_angle) * gTorqueScale * 10.0;
                elbowR_vel = (elbowR_vel + ((elbowR_target - elbowR_angle) * 20 + gravityPullElbowR) * dt) * 0.88;
                elbowR_angle += elbowR_vel * dt;
                skeletonRig.elbowR.rotation.x = elbowR_angle;

                // 双腿
                const legL_target = -activeSwing;
                const gravityPullLegL = -Math.sin(legL_angle) * gTorqueScale * 10.0;
                legL_vel = (legL_vel + ((legL_target - legL_angle) * 25 + gravityPullLegL) * dt) * 0.90;
                legL_angle += legL_vel * dt;
                skeletonRig.hipL.rotation.x = legL_angle;
                skeletonRig.kneeL.rotation.x = Math.max(0, activeSwing * curKnee * 1.1) + (ragdoll * Math.abs(Math.sin(animTime * 2)) * 0.5);

                const legR_target = activeSwing;
                const gravityPullLegR = -Math.sin(legR_angle) * gTorqueScale * 10.0;
                legR_vel = (legR_vel + ((legR_target - legR_angle) * 25 + gravityPullLegR) * dt) * 0.90;
                legR_angle += legR_vel * dt;
                skeletonRig.hipR.rotation.x = legR_angle;
                skeletonRig.kneeR.rotation.x = Math.max(0, -activeSwing * curKnee * 1.1) + (ragdoll * Math.abs(Math.sin(animTime * 2)) * 0.5);

            } else {
                // 待机状态
                const breathe = Math.sin(animTime) * 0.02 * curWobble;
                skeletonRig.pelvis.position.y = 0.75 + breathe;
                skeletonRig.pelvis.rotation.set(0, 0, 0);
                skeletonRig.spine.rotation.set(0, 0, Math.sin(animTime * 0.5) * 0.03);
                skeletonRig.chest.rotation.set(0, 0, 0);

                skeletonRig.head.rotation.set(0, headInertiaYaw, Math.sin(animTime * 0.5) * 0.05);

                armL_angle += (-armL_angle) * Math.min(1.0, gTorqueScale * 0.5 + 0.1);
                armR_angle += (-armR_angle) * Math.min(1.0, gTorqueScale * 0.5 + 0.1);
                elbowL_angle += (-0.15 - elbowL_angle) * 0.2;
                elbowR_angle += (-0.15 - elbowR_angle) * 0.2;

                skeletonRig.shoulderL.rotation.set(armL_angle + breathe, 0, 0.04 + gTorqueScale * 0.02);
                skeletonRig.elbowL.rotation.set(elbowL_angle, 0, 0);

                skeletonRig.shoulderR.rotation.set(armR_angle - breathe, 0, -0.04 - gTorqueScale * 0.02);
                skeletonRig.elbowR.rotation.set(elbowR_angle, 0, 0);

                legL_angle += (-legL_angle) * 0.2;
                legR_angle += (-legR_angle) * 0.2;
                skeletonRig.hipL.rotation.set(legL_angle, 0, 0);
                skeletonRig.kneeL.rotation.set(0.03, 0, 0);

                skeletonRig.hipR.rotation.set(legR_angle, 0, 0);
                skeletonRig.kneeR.rotation.set(0.03, 0, 0);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
